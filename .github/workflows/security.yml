name: Security

on:
  pull_request:
  schedule:
    # Every Monday 06:00 UTC — catches newly-disclosed CVEs in dependencies
    # that haven't changed, not just ones introduced by a given PR.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  api-security:
    name: API — bandit, pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements-dev.txt
      - name: bandit (SAST)
        working-directory: apps/api
        run: bandit -c pyproject.toml -r app -q
      - name: pip-audit (dependency CVEs)
        working-directory: apps/api
        run: pip-audit -r requirements.txt

  web-security:
    name: Web — npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: npm audit (dependency CVEs)
        working-directory: apps/web
        run: npm audit --audit-level=high
