[project]
name = "rit-api"
version = "0.1.0"
description = "Regional Initiatives Tracker — API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]  # autogenerated, not hand-authored

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S105", "S106"]  # hardcoded test passwords are not secrets

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern is `param: T = Depends(...)` by design — these calls
# are evaluated once per request by the framework, not at import time, so
# the usual "mutable default argument" hazard B008 guards against doesn't apply.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Cookie", "app.core.deps.require_role"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
exclude = ["alembic/"]

[[tool.mypy.overrides]]
# Test modules stay type-checked but not to the letter of `strict` — FastAPI
# dependency-injection params (`_: User = Depends(...)`) and pytest fixtures
# are conventionally left unannotated in the test suite itself.
module = "app.tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.bandit]
# Test-only findings (assert usage, httpx clients hitting an in-process ASGI
# transport with no real network) are noise here — bandit still runs on
# everything under app/ that ships to production.
exclude_dirs = ["app/tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
