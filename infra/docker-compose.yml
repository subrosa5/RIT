services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rit
    volumes:
      - rit_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rit"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://rit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/rit
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env (>= 32 random bytes)}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: '["http://localhost:8080"]'
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "8000:8000"

  web:
    build:
      context: ../apps/web
      args:
        VITE_API_URL: http://localhost:8000/api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  rit_db_data:
